defaults:
  - override hydra/job_logging: stdout
  - _self_

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false

data:
  root: datasets
  name: electricity
  # null inherits config.json; [] explicitly keeps every source user.
  config_path: null
  drop_users: null
  target_cols: null
  date_col: null
  aggr: null
  aggr_period: null
  missing_values: null  # null/config omission defaults to zero; alternative: error
  date_splits: [0.6, 0.2, 0.2]
  indiv_split: 0.8
  eval_stride: 24

task:
  lags: 168
  horizon: 24

model:
  name: patchtst
  kwargs: {}

normalization:
  # name: none | standard | revin | min
  name: revin
  kwargs:
    affine: true
    # RevIN also accepts center: mean | last | median | none,
    # scale: std | mad | none, and transform: null | arcsinh.
    # MIN always has untied learnable input/output affine parameters and
    # therefore requires affine: true.

training:
  batch_size: 256
  epochs: 10000
  # Optional exact optimizer-step cap. The Slurm profiles set this explicitly.
  steps: null
  lr: 1e-5
  loss: nmse
  device: gpu
  valid_eval_freq: 1000
  logging_eval_freq: 1000
  plot_step_train_loss: false

seed: 1
seeds: null

output:
  dir: outputs/manual_debug/electricity/168_24
  name: patchtst_revin_nmse
